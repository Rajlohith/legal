<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Search — Iudicium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>

<body>

  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__top">
        <a href="index.html" class="sidebar__brand"><i data-lucide="scale"></i><span class="label">Case
            Search</span></a>
        <button class="sidebar__toggle" id="sidebarToggle" title="Collapse sidebar" aria-label="Toggle sidebar">
          <i data-lucide="panel-left-close"></i>
        </button>
      </div>
      <nav class="sidebar__nav">
        <a href="index.html" class="sidebar__link" title="Home"><i data-lucide="home"></i><span class="label">Home</span></a>
        <div class="sidebar__group-label sidebar__group-label--mt"><span class="label">Tools</span></div>
        <a href="assistant.html" class="sidebar__link" title="AI Assistant"><i data-lucide="message-circle"></i><span
            class="label">AI Assistant</span></a>
        <a href="search.html" class="sidebar__link" title="Detailed Search"><i data-lucide="search"></i><span
            class="label">Detailed Search</span></a>
        <a href="case-number.html" class="sidebar__link sidebar__link--active" title="Quick Search"><i data-lucide="zap"></i><span
            class="label">Quick Search</span></a>
        <div class="sidebar__group-label sidebar__group-label--mt"><span class="label">Help</span></div>
        <a href="guide.html" class="sidebar__link" title="Guide"><i data-lucide="book-open"></i><span
            class="label">Guide</span></a>
        <a href="faq.html" class="sidebar__link" title="FAQ"><i data-lucide="help-circle"></i><span
            class="label">FAQ</span></a>
      </nav>
    </aside>

    <div class="app-main">

      <header class="topbar">
        <div class="topbar__title">
          <h1><i data-lucide="zap"></i> Quick Search</h1>
        </div>
        <div class="topbar__status" id="connStatus">
          <span class="dot" id="connDot"></span>
          <span id="connLabel">Connecting…</span>
        </div>
      </header>

      <main class="layout">

        <!-- ===================== Search card ===================== -->
        <section class="card search-card">

          <form id="caseNumberForm">

            <p class="hint">Looks up a single case using its exact reference. The CAPTCHA is solved automatically.</p>

            <div class="field-group">
              <label class="field-label" for="dbBench">Select Bench <span class="req">*</span></label>
              <select id="dbBench" required>
                <option value="">-- Select --</option>
              </select>
            </div>

            <div class="grid-3">
              <div class="field-group">
                <label class="field-label" for="caseType">Case Type <span class="req">*</span></label>
                <select id="caseType" required></select>
              </div>
              <div class="field-group">
                <label class="field-label" for="caseNo">Case Number <span class="req">*</span></label>
                <input type="text" id="caseNo" maxlength="6" inputmode="numeric" placeholder="e.g. 48907" required>
              </div>
              <div class="field-group">
                <label class="field-label" for="caseYear">Case Year <span class="req">*</span></label>
                <select id="caseYear" required></select>
              </div>
            </div>

            <div class="field-group">
              <label class="field-label" for="outputFilename">Save results as <span
                  class="opt">(optional)</span></label>
              <input type="text" id="outputFilename" placeholder="Case_Search_Results.xlsx">
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary btn-lg" id="runBtn">▶ Run Search</button>
              <button type="button" class="btn btn-danger" id="stopBtn" disabled>■ Stop</button>
            </div>

            <div class="progress-wrap" hidden id="progressWrap">
              <div class="progress-bar">
                <div class="progress-bar__fill" id="progressFill"></div>
              </div>
              <p class="progress-label" id="progressLabel">Ready</p>
            </div>
          </form>

        </section>

        <!-- ===================== Activity log ===================== -->
        <section class="card log-card">
          <div class="log-card__title">
            <h2>Activity Log</h2>
            <button class="btn btn-ghost btn-sm" id="clearLogBtn"><i data-lucide="trash-2"></i> Clear</button>
          </div>
          <div class="log-box" id="logBox"></div>
        </section>

        <!-- ===================== Results ===================== -->
        <section class="card results-card" id="resultsCard" hidden>
          <div class="card-header">
            <div class="results-header-left">
              <h2>Results</h2>
              <button class="btn btn-ghost btn-sm" id="clearResultsBtn" title="Clear results"><i data-lucide="x-circle"></i> Clear</button>
            </div>
            <div class="download-options">
              <a class="btn btn-outline btn-sm" id="downloadLink" href="#" download><i data-lucide="file-spreadsheet"></i> Excel</a>
              <button class="btn btn-outline btn-sm" id="downloadPdfBtn"><i data-lucide="file-text"></i> PDF</button>
              <button class="btn btn-outline btn-sm" id="downloadMdBtn"><i data-lucide="file-code"></i> Markdown</button>
            </div>
          </div>
          <p class="results-summary" id="resultsSummary"></p>
          <div id="resultsList" class="results-list"></div>
        </section>

      </main>

    </div>
  </div>

  <script src="sidebar.js"></script>
  <script src="case-number.js"></script>
</body>

</html>
